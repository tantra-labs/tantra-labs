[workspace]
resolver = "2"
members = [
  "crates/vyapaar-brain-core",
  "crates/vyapaar-brain-llm",
  "crates/vyapaar-brain-agent",
  "crates/vyapaar-brain-prompt",
  "crates/vyapaar-brain-replay",
  "crates/vyapaar-brain-trader-loop",
  "crates/vyapaar-brain-research",
  "crates/vyapaar-brain-analytics",
  "crates/vyapaar-brain-genetic",
  "crates/vyapaar-brain-mcp",
  "crates/vyapaar-brain-tools",
  "crates/vyapaar-brain-plugins",
  "crates/vyapaar-brain-report",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0"
repository = "https://github.com/vyapaar-labs/vyapaar-brain"

[workspace.dependencies]
vyapaar-core = { path = "../vyapaar-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
async-trait = "0.1"
