[alias]
dev = "build --workspace --profile dev"
test = "build --workspace --profile test"
check-dev = "check --workspace --profile dev"
check-release = "check --workspace --profile release"
test-release = "test --workspace --profile release"
b = "build --workspace --profile release"
t = "test --workspace --profile release"
c = "check --workspace --profile release"
r = "run --profile release"

[profile.dev]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "debuginfo"

[profile.test]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "debuginfo"

[profile.dbg]
inherits = "dev"
opt-level = 0
lto = false
debug = 2
strip = "none"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
