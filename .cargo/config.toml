[alias]
dev = "build --workspace --profile dev"
test = "test --workspace --profile prod"
check-dev = "check --workspace --profile dev"
b = "build --workspace --profile prod"
t = "test --workspace --profile prod"
c = "check --workspace --profile prod"
r = "run --profile prod"

[profile.dev]
opt-level = 1
debug = false
strip = "debuginfo"

[profile.test]
opt-level = 1
debug = false
strip = "debuginfo"

[profile.dbg]
inherits = "dev"
opt-level = 0
lto = false
debug = 2
strip = "none"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.prod]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
